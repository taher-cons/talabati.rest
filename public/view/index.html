<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <title>عرض الطبق ثلاثي الأبعاد | طلباتي</title>

  <!--
    WHY THIS PAGE REPLACES THE OLD /ar EXPERIENCE
    =============================================
    /ar mixed two incompatible AR engines in one A-Frame scene:
      * AR.js  — marker tracking, grabs the camera via getUserMedia
      * WebXR `ar-hit-test` — needs a WebXR session started by an explicit
        "Enter AR" gesture, which AR.js never starts
    So `hit-test-result` never fired and the UI sat on "جاري البحث عن سطح"
    forever. On iOS it could never work at all: Safari has no WebXR.

    <model-viewer> is Google's maintained element and solves this properly:
      * Always renders an interactive 3D model (works on every phone, no camera
        permission needed) — the customer ALWAYS sees the dish.
      * "View on your table" hands off to the platform's native AR:
        Scene Viewer (ARCore) on Android, Quick Look on iOS when a USDZ exists.
      * Real-world scale comes from the GLB itself, so a dish authored at ~30 cm
        lands on the table at ~30 cm.
  -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/view/styles.css?v=1">
</head>
<body>

  <header class="bar">
    <a class="back" id="back-link" href="/menu" aria-label="رجوع إلى القائمة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6"/>
      </svg>
      <span>القائمة</span>
    </a>
    <span class="bar-title" id="bar-title">عرض ثلاثي الأبعاد</span>
  </header>

  <main class="stage">
    <!-- Populated by main.js once the dish is fetched -->
    <model-viewer
      id="viewer"
      alt=""
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      shadow-softness="0.8"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="auto"
      interaction-prompt-threshold="2000"
      
      camera-orbit="0deg 50deg 115%"
      min-camera-orbit="auto 5deg auto"
      max-camera-orbit="auto 85deg auto"
      field-of-view="32deg"
      min-field-of-view="18deg"
      max-field-of-view="45deg"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      ar-placement="floor"
      loading="eager"
      hidden>
      <!-- model-viewer hides this button automatically when the device cannot
           do AR, so we never show a button that would do nothing. -->
      <button class="ar-btn" slot="ar-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
        </svg>
        <span>ضَعه على طاولتك</span>
      </button>

      <div class="progress" slot="progress-bar" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </model-viewer>

    <!-- Loading / error / no-model states all live here so the screen is never
         blank without an explanation. -->
    <div class="state" id="state">
      <div class="spinner" aria-hidden="true"></div>
      <p id="state-text">جارٍ تحضير الطبق…</p>
      <a class="state-action" id="state-action" href="/menu" hidden>العودة إلى القائمة</a>
    </div>
  </main>

  <section class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <h1 class="dish-name" id="dish-name"></h1>
      <span class="dish-price" id="dish-price"></span>
    </div>
    <p class="dish-desc" id="dish-desc"></p>

    <p class="hint" id="hint">اسحب بإصبعك لتدوير الطبق · باعد إصبعيك للتكبير</p>

    <div class="sheet-actions">
      <button class="btn btn-accent" id="btn-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <span>أضف إلى طلبي</span>
      </button>
      <a class="btn btn-secondary" id="btn-menu" href="/menu">بقية الأطباق</a>
    </div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/view/main.js?v=1"></script>
</body>
</html>
