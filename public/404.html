<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة غير موجودة - طلباتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a73e8; --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --dark: #1a1a2e; --white: #ffffff; --gray: #6c757d;
    }
    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 2rem;
    }
    .error-container {
      text-align: center;
      max-width: 500px;
      background: white;
      padding: 4rem 3rem;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title { font-size: 2rem; font-weight: 700; color: var(--dark); margin-bottom: 1rem; }
    .error-message { color: var(--gray); font-size: 1.1rem; margin-bottom: 2.5rem; line-height: 1.7; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn-primary {
      background: var(--gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5); }
    .links { margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .links a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
      background: var(--gradient);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="icon">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">الصفحة غير موجودة</h1>
    <p class="error-message">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. قد يكون الرابط خاطئاً أو الصفحة تمت إزالتها.</p>
    <a href="/" class="btn btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      العودة للرئيسية
    </a>
    <div class="links">
      <a href="/menu">قوائم الطعام</a>
      <a href="/ar">تجربة AR</a>
      <a href="/admin">لوحة التحكم</a>
    </div>
  </div>
</body>
</html>
