# Supabase Configuration for WebAR Menu
project_id = "webar-menu"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54323
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54327
file_size_limit = "50MiB"

[functions]
enabled = true
port = 54328

[auth]
enabled = true
port = 54329
jwt_secret = "your-super-secret-jwt-token-with-at-least-32-characters"
site_url = "https://talabati.rest"
redirect_urls = ["https://talabati.rest/**", "http://localhost:3000/**"]

# Additional auth providers
[auth.external]
google_enabled = true
google_client_id = "your-google-client-id"
google_secret = "your-google-secret"

[auth.email]
enable_signup = true
double_confirm_changes = true
secure_email_change = true

[auth.sms]
enabled = false