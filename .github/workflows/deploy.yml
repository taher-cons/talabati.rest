name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT_ID: talabati-rest

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./web-ar-menu

      - name: Install function dependencies
        run: npm ci
        working-directory: ./web-ar-menu/functions

      - name: Run linting
        run: npm run lint
        working-directory: ./web-ar-menu
        continue-on-error: true

      - name: Run type checking
        run: npx tsc --noEmit
        working-directory: ./web-ar-menu/functions

      - name: Run tests
        run: npm test
        working-directory: ./web-ar-menu
        continue-on-error: true

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./web-ar-menu

      - name: Build frontend
        run: npm run build
        working-directory: ./web-ar-menu
        env:
          NODE_ENV: production
          CLIENT_URL: https://talabati.rest
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web-ar-menu/dist/
          retention-days: 1

  build-functions:
    name: Build Firebase Functions
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install function dependencies
        run: npm ci
        working-directory: ./web-ar-menu/functions

      - name: Build functions
        run: npm run build
        working-directory: ./web-ar-menu/functions

      - name: Upload function artifacts
        uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: web-ar-menu/functions/lib/
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-frontend, build-functions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: web-ar-menu/dist/

      - name: Download functions build
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: web-ar-menu/functions/lib/

      - name: Deploy to Firebase Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: staging
          entryPoint: ./web-ar-menu

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-functions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: web-ar-menu/dist/

      - name: Download functions build
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: web-ar-menu/functions/lib/

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          entryPoint: ./web-ar-menu

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "Deployment completed"
          echo "Status: ${{ needs.deploy-production.result }}"
        # Add Slack/Discord/Email notification here